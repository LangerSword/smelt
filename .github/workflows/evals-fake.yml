name: evals-fake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"  # weekly, Sunday 04:17 UTC

jobs:
  meta-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --dev
      - name: cache cargo target
        uses: actions/cache@v4
        with:
          path: ~/.cache/smelt/target
          key: smelt-target-${{ runner.os }}-${{ hashFiles('src/smelt_rs/scaffold/templates.py') }}
      - name: meta-eval — all 10 known-wrong rewrites must be rejected
        run: uv run python scripts/meta_eval.py --cases 60
