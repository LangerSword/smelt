name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run pytest -q

  fake-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --dev
      - name: cache cargo target
        uses: actions/cache@v4
        with:
          path: ~/.cache/smelt/target
          key: smelt-target-${{ runner.os }}-${{ hashFiles('src/smelt_rs/scaffold/templates.py') }}
      - name: fake accept (correct candidate)
        run: uv run smelt run examples/demo/run_length.py:rle_encode --provider fake --candidate tests/fixtures/candidates/rle_encode_correct.rs --cases 200
      - name: fake reject (wrong candidate must exit 4)
        run: |
          set +e
          uv run smelt run examples/demo/run_length.py:rle_encode --provider fake --candidate tests/fixtures/candidates/rle_encode_wrong.rs --cases 60
          code=$?
          echo "exit=$code"
          test "$code" -eq 4
