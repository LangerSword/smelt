name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - run: uv run pytest -q

  fake-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --dev
      - name: cache cargo target
        uses: actions/cache@v4
        with:
          path: ~/.cache/smelt/target
          key: smelt-target-${{ runner.os }}-${{ hashFiles('src/smelt_rs/scaffold/templates.py') }}
      - name: fake accept (correct candidate)
        run: uv run smelt run examples/demo/run_length.py:rle_encode --provider fake --candidate tests/fixtures/candidates/rle_encode_correct.rs --cases 200
      - name: fake reject (wrong candidate must exit 4)
        run: |
          set +e
          uv run smelt run examples/demo/run_length.py:rle_encode --provider fake --candidate tests/fixtures/candidates/rle_encode_wrong.rs --cases 60
          code=$?
          echo "exit=$code"
          test "$code" -eq 4
      - name: repair gate (wrong -> evidence -> correct must exit 0)
        run: |
          mkdir -p /tmp/smelt-repair-cands
          cp tests/fixtures/candidates/rle_encode_wrong.rs /tmp/smelt-repair-cands/01_wrong.rs
          cp tests/fixtures/candidates/rle_encode_correct.rs /tmp/smelt-repair-cands/02_correct.rs
          uv run smelt run examples/demo/run_length.py:rle_encode --provider fake --candidate '/tmp/smelt-repair-cands/*.rs' --cases 60
      - name: domain guard (out-of-i64 output must exit 3)
        run: |
          set +e
          uv run smelt capture examples/demo/scale_up.py:scale_up --cases 60
          code=$?
          echo "exit=$code"
          test "$code" -eq 3

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --dev
      - name: vendored plugin core in sync
        run: python3 scripts/sync_plugin.py --check
      - name: served-surface smoke (register + hook dispatch + real handler)
        run: SMELT_BIN="$PWD/.venv/bin/smelt" python3 plugin/smoke_load.py

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -timeout 240s
