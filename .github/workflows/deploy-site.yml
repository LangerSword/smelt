name: deploy-site

# The static site: build it, regenerate the generated pages, check the links,
# run Lighthouse (report only), deploy to GitHub Pages, then keep exactly one
# deployment.
#
# The generated pages (results, CLI reference) are rebuilt here from committed
# inputs — evals/results.json, docs/cli.md, and the captured
# site/_partials/smelt-help.txt snapshot — so this job is reproducible on a bare
# runner. If a rebuild changes the committed pages, the build fails: the pages
# on main must always match what the generator produces.
#
# No untrusted event input reaches any `run:` block here (the triggers are push
# and workflow_dispatch only).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "evals/results.json"
      - "docs/cli.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate results + CLI reference
        run: python3 site/scripts/build.py

      - name: Pages must match the generators (no drift)
        run: |
          if ! git diff --quiet -- site/; then
            echo "::error::the committed pages differ from what the generators produce — run 'python3 site/scripts/build.py' and commit"
            git --no-pager diff --stat -- site/
            exit 1
          fi
          echo "generated pages match their sources"

      - name: Check internal links
        run: python3 site/scripts/check_links.py

      - name: Serve the site for Lighthouse
        run: |
          cd site && python3 -m http.server 8080 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/index.html && exit 0
            sleep 0.5
          done
          echo "::error::site did not come up on :8080"; exit 1

      - name: Lighthouse CI (report only)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://localhost:8080/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      # One deployment, always — keep only the newest, delete older Pages
      # deployments. The default GITHUB_TOKEN cannot delete deployments (403,
      # "Resource not accessible by integration"), so this is best-effort here;
      # run `node tools/prune-deployments.mjs` locally with a PAT when needed.
      - name: Prune old deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/prune-deployments.mjs