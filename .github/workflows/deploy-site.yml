name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "evals/results.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate results + CLI reference
        run: |
          python3 site/scripts/gen_results.py
          python3 site/scripts/gen_cli_ref.py

      - name: Check generated results match committed page
        run: |
          python3 site/scripts/build.py
          # The build injects generated HTML into the pages; ensure git sees no
          # drift beyond the generated partials (results are regenerated, not hand-edited).
          if ! git diff --quiet -- site/index.html site/results.html; then
            echo "::error::generated results differ from committed page — run build.py and commit"
            git --no-pager diff --stat -- site/index.html site/results.html
            exit 1
          fi
          echo "results page matches evals/results.json"

      - name: Check internal links
        run: python3 site/scripts/check_links.py

      - name: Lighthouse CI (report only)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/index.html
          uploadArtifacts: true
          configPath: ./site/lighthouserc.json
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      # One deployment, always — keep only the newest, delete older Pages deployments.
      - name: Prune old deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/prune-deployments.mjs
