<!-- Oracle matrix — original SVG. A grid of recorded input/output cases, every
     one matching, with the content hash and a read-only lock. The grid is an
     SVG <pattern> so the file stays small. Corpus label is the real count
     from the eval corpus (int-category targets ran 209 cases). -->
<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oracle matrix: a grid of recorded cases all matching, with a content hash and a read-only lock">
  <defs>
    <linearGradient id="om-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151A"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="om-cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6D3A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B34700" stop-opacity="0.12"/>
    </linearGradient>
    <!-- One 22px cell tile; the grid is this pattern repeated -->
    <pattern id="om-tile" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="16" height="16" rx="3"
            fill="url(#om-cell)" stroke="#FF6D3A" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" rx="16" fill="url(#om-panel)"/>

  <text x="28" y="42" font-family="monospace" font-size="12" fill="#8B93A1" letter-spacing="1.6">ORACLE · FROZEN CORPUS</text>
  <text x="28" y="70" font-family="monospace" font-size="19" fill="#E8EAED">209 cases · all matching</text>

  <!-- Hash + read-only lock -->
  <g transform="translate(404,26)">
    <rect width="208" height="52" rx="10" fill="#0D0F12" stroke="#262A32"/>
    <text x="14" y="21" font-family="monospace" font-size="10" fill="#8B93A1" letter-spacing="1.2">SHA256</text>
    <text x="14" y="39" font-family="monospace" font-size="12" fill="#D4A017">60ec55285b23</text>
    <g transform="translate(172,15)" fill="none" stroke="#D4A017" stroke-width="1.6">
      <rect x="0" y="9" width="18" height="14" rx="2.5"/>
      <path d="M4 9 V5.5 a5 5 0 0 1 10 0 V9"/>
    </g>
  </g>

  <!-- Case grid: 26 columns x 6 rows x 22px = 572 x 132 -->
  <rect x="28" y="96" width="572" height="132" fill="url(#om-tile)"/>

  <!-- Legend -->
  <g transform="translate(28,318)">
    <rect x="0" y="0" width="11" height="11" rx="2.5" fill="url(#om-cell)" stroke="#FF6D3A" stroke-opacity="0.5"/>
    <text x="20" y="10" font-family="monospace" font-size="11" fill="#A8ADB6">input recorded</text>
    <path d="M172 2 l4 4 l6 -7" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="10" font-family="monospace" font-size="11" fill="#A8ADB6">output matches</text>
    <text x="336" y="10" font-family="monospace" font-size="11" fill="#8B93A1">read-only</text>
  </g>
</svg>